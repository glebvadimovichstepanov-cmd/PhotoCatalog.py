[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "photocatalog"
version = "2.0.0"
description = "Non-destructive photo and video catalog for Windows"
requires-python = ">=3.12"
dependencies = ["Pillow>=12.3,<13"]

[project.optional-dependencies]
video = ["pymediainfo>=7.0.1,<8"]
test = ["pytest>=9.1,<10", "ruff>=0.16,<0.17"]

[project.scripts]
photocatalog = "photocatalog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
